name: old_permic_ocr_mobile
description: تطبيق Flutter مفتوح المصدر لتجربة OCR لمحارف البرمية القديمة.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  connectivity_plus: ^6.1.4
  dio: ^5.8.0+1
  file_picker: ^8.3.7
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  onnxruntime: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

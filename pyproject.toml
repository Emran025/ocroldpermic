[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "old-permic-ocr-lab"
version = "0.3.0"
description = "Historical glyph synthetic-data engine + progressive curriculum + YOLO training engine"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "scipy>=1.11",
    "scikit-image>=0.21",
    "opencv-python-headless>=4.8",
    "lxml>=4.9",
    "svglib>=1.5",
    "reportlab>=4.0",
    "psutil>=5.9",
    "ipywidgets>=8.0",
    "tqdm>=4.65",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
colab = ["google-colab"]

[tool.setuptools.packages.find]
where = ["lib"]
include = [
    "historical_glyph_studio*",
    "historical_glyph_curriculum*",
    "historical_glyph_training*",
]
